name: AXIOM Verify checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      kane:
        description: Run genuine Kane CLI against the published AXIOM Verify demo (requires repository secrets)
        type: boolean
        default: false
      repair:
        description: Recheck the agent-repaired deployment with genuine Kane CLI (requires repository secrets)
        type: boolean
        default: false
      sentinel:
        description: Verify the deployed AXIOM Sentinel sandbox through real Kane CLI (requires secrets and public app URL)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run sentinel:gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sentinel-synthetic-ci-gate
          path: evidence/sentinel-ci-gate.json
          retention-days: 7
  kane:
    if: github.event_name == 'workflow_dispatch' && inputs.kane
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global @testmuai/kane-cli
      - name: Execute actual Kane CLI browser acceptance (fail closed)
        env:
          TESTMU_USERNAME: ${{ secrets.TESTMU_USERNAME }}
          TESTMU_ACCESS_KEY: ${{ secrets.TESTMU_ACCESS_KEY }}
          AXIOM_VERIFY_URL: https://axiom-verify-kanecli-zhpdm6.v2.appdeploy.ai/
        run: |
          test -n "$TESTMU_USERNAME" && test -n "$TESTMU_ACCESS_KEY" || { echo 'Missing TestMu credentials; NOT VERIFIED'; exit 1; }
          npm run verify:kane
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kane-evidence
          path: evidence/
          retention-days: 7

  kane_repaired:
    if: github.event_name == 'workflow_dispatch' && inputs.repair
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global @testmuai/kane-cli
      - name: Kane CLI acceptance on repaired live app (fail closed)
        env:
          TESTMU_USERNAME: ${{ secrets.TESTMU_USERNAME }}
          TESTMU_ACCESS_KEY: ${{ secrets.TESTMU_ACCESS_KEY }}
          AXIOM_VERIFY_URL: https://axiom-verify-agent-repaired-mqlpg4.v2.appdeploy.ai/
        run: |
          test -n "$TESTMU_USERNAME" && test -n "$TESTMU_ACCESS_KEY" || { echo 'Missing TestMu credentials; NOT VERIFIED'; exit 1; }
          npm run verify:repaired
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kane-repaired-evidence
          path: evidence/
          retention-days: 7

  kane_sentinel:
    # Reproduction-only one-shot trigger. Must be removed after this push.
    if: (github.event_name == 'workflow_dispatch' && inputs.sentinel) || (github.event_name == 'push' && github.ref == 'refs/heads/repro/sentinel-idempotency-closedloop' && github.actor == 'evansmusitu' && github.event.head_commit.message == 'Reproduce Sentinel idempotency bug with genuine Kane once')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global @testmuai/kane-cli
      - name: Real browser acceptance against deployed Sentinel (fail closed)
        env:
          TESTMU_USERNAME: ${{ secrets.TESTMU_USERNAME }}
          TESTMU_ACCESS_KEY: ${{ secrets.TESTMU_ACCESS_KEY }}
          AXIOM_SENTINEL_URL: https://axiom-sentinel-idempotency-bug-reproduction-f7ftag.v2.appdeploy.ai/
        run: |
          test -n "$TESTMU_USERNAME" && test -n "$TESTMU_ACCESS_KEY" && test -n "$AXIOM_SENTINEL_URL" || { echo 'Missing Sentinel URL or TestMu secrets; NOT VERIFIED'; exit 1; }
          npm run verify:sentinel
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kane-sentinel-evidence
          path: evidence/
          retention-days: 7